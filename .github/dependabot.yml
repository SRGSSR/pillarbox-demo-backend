version: 2
updates:
  # --- GitHub Actions, pinned by commit ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      action-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- Gradle ---
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      gradle-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "org.jetbrains.kotlin.*"
          - "org.gradle:gradle-wrapper"
        update-types:
          - "minor"
          - "patch"
      gradle-kotlin:
        patterns:
          - "org.jetbrains.kotlin.*"
        update-types:
          - "minor"
          - "patch"

  # --- NPM ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      node-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # --- Base images of the Dockerfile, pinned by tag and digest ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "node"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]
