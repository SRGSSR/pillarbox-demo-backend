name: Promote Version to Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Enter the version to promote as stable (e.g., 1.0.0)"
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
    env:
      IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/pillarbox-demo-backend
      VERSION: ${{ inputs.version }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.GH_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Pull the selected version of the image
        run: docker pull "$IMAGE:$VERSION"

      - name: Tag the image as stable
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:stable"
          docker push "$IMAGE:stable"

      - name: ECS deployment
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecs update-service \
            --cluster pillarbox-demo-backend-cluster \
            --service demo-backend-service \
            --force-new-deployment \
            --region "$AWS_REGION" >/dev/null
