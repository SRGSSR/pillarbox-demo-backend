name: Release

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check-version.outputs.version }}

    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Needed for semantic-release

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Pinned to 22 instead of .nvmrc: see
          # https://github.com/semantic-release/github/issues/1224
          node-version: '22'

      - name: Install semantic-release
        run: |
          npm ci

      - name: Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release

      - name: Check version
        id: check-version
        run: >
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
            echo "Resolved version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "No version produced."
            echo "version=" >> $GITHUB_OUTPUT
          fi

  publish:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.version != ''  # Skip deploy if no version is set
    permissions:
      id-token: write
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read Node version from .nvmrc
        id: read_nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ secrets.GH_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and Push Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
          tags: |
            ${{ env.ECR_REGISTRY }}/pillarbox-demo-backend:${{ needs.release.outputs.version }}
            ${{ env.ECR_REGISTRY }}/pillarbox-demo-backend:latest

  deploy-dev:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ secrets.GH_DEV_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: ECS deployment
        run: >
          aws ecs update-service \
            --cluster pillarbox-demo-backend-cluster \
            --service demo-backend-service \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }} >/dev/null
