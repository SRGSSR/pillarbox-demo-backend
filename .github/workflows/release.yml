name: Release

on:
  push:
    branches: [ main ]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check-version.outputs.version }}

    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Needed for semantic-release
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '27'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Pinned to 22 instead of .nvmrc: see
          # https://github.com/semantic-release/github/issues/1224
          node-version: '22'

      - name: Install semantic-release
        run: npm ci --ignore-scripts

      - name: Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Check version
        id: check-version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
            echo "Resolved version: $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No version produced."
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  publish:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.version != ''  # Skip deploy if no version is set
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.GH_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Build and Push Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/pillarbox-demo-backend:${{ needs.release.outputs.version }}
            ${{ env.ECR_REGISTRY }}/pillarbox-demo-backend:latest

  deploy-dev:
    runs-on: ubuntu-latest
    needs: publish
    environment: dev
    permissions:
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.GH_DEV_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: ECS deployment
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecs update-service \
            --cluster pillarbox-demo-backend-cluster \
            --service demo-backend-service \
            --force-new-deployment \
            --region "$AWS_REGION" >/dev/null
