name: Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '20 6 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SARIF: ${{ !github.event.pull_request.head.repo.fork }}

jobs:
  zizmor:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.30.1
          inputs: .github
          advanced-security: ${{ env.SARIF == 'true' }}

  trivy-config:
    name: Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          format: ${{ env.SARIF == 'true' && 'sarif' || 'table' }}
          output: ${{ env.SARIF == 'true' && 'trivy.sarif' || 'trivy.txt' }}

      - name: Summary
        if: ${{ always() && env.SARIF != 'true' }}
        env:
          NAME: Config (Dockerfile)
        run: sh .github/scripts/trivy-summary.sh trivy.txt "$NAME"

      - name: Report
        if: ${{ env.SARIF == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-config

  trivy-image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      IMAGE: pillarbox-demo-backend:scan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t "$IMAGE" .

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.IMAGE }}
          timeout: 15m
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: ${{ env.SARIF == 'true' && 'sarif' || 'table' }}
          output: ${{ env.SARIF == 'true' && 'trivy.sarif' || 'trivy.txt' }}

      - name: Summary
        if: ${{ always() && env.SARIF != 'true' }}
        env:
          NAME: Image
        run: sh .github/scripts/trivy-summary.sh trivy.txt "$NAME"

      - name: Report
        if: ${{ env.SARIF == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image
