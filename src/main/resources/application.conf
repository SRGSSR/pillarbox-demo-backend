ktor {
  deployment {
    port = 8080
    development = false
    development = ${?DEVELOPMENT}
    watch = [classes, resources]
    watchDelay = 500
    enable_forwarded_headers = false
    enable_forwarded_headers = ${?ENABLE_FORWARDED_HEADERS}
  }

  application {
    modules = [ch.srgssr.pillarbox.backend.ApplicationKt.module]
  }
}

database {
  autoCreate = false
  driverClassName = "org.postgresql.Driver"
  jdbcUrl = ${?DATABASE_URL}
  username = ${?DATABASE_USER}
  password = ${?DATABASE_PASSWORD}
  encryptionKey = ${?DATABASE_ENCRYPTION_KEY}

  properties {
    cachePrepStmts = "true"
    prepStmtCacheSize = "250"
    prepStmtCacheSqlLimit = "2048"
    useServerPrepStmts = "true"
    reWriteBatchedInserts = "true"
  }
}

oidc {
  issuer = ${?AUTH_ISSUER}
  discovery_path = ".well-known/openid-configuration"
  discovery_path = ${?AUTH_DISCOVERY_PATH}
  client_id = ${?AUTH_CLIENT_ID}
  secret = ${?AUTH_CLIENT_SECRET}
  realm = "Pillarbox"
  scopes = "openid,profile,email"
  scopes = ${?AUTH_SCOPES}
}

integrationLayer {
  baseUrl = "https://il.srgssr.ch"
  baseUrl = ${?INTEGRATION_LAYER_BASE_URL}
}

session {
  cookieSecret = ${?SESSION_COOKIE_SECRET}
  timeoutSeconds = 28800
  timeoutSeconds = ${?SESSION_TIMEOUT}
  validationIntervalSeconds = 600
  validationIntervalSeconds = ${?SESSION_VALIDATION_INTERVAL}
  secure = true
  secure = ${?SESSION_SECURE}
}
